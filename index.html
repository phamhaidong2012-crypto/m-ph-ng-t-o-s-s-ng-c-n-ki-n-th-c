<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng 3D Mặt Trời (G2V Star Simulation)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030712;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased h-screen overflow-hidden flex flex-col justify-between">

    <header class="absolute top-0 left-0 w-full z-10 p-4 md:p-6 flex justify-between items-center pointer-events-none">
        <div class="pointer-events-auto flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-amber-500/20 border border-amber-500/40 flex items-center justify-center shadow-lg shadow-amber-500/20">
                <span class="text-amber-400 font-bold text-lg">☀️</span>
            </div>
            <div>
                <h1 class="text-lg md:text-xl font-bold tracking-tight bg-gradient-to-r from-amber-200 via-orange-400 to-yellow-500 bg-clip-text text-transparent">Mặt Trời (G2V Star)</h1>
                <p class="text-xs text-slate-400">Mô phỏng 3D tương tác không gian thực</p>
            </div>
        </div>
        <div class="pointer-events-auto hidden md:flex items-center space-x-2 text-xs bg-slate-900/80 border border-slate-800 px-3 py-1.5 rounded-full text-slate-300">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>Kéo chuột để xoay • Cuộn bánh xe để phóng to/thu nhỏ</span>
        </div>
    </header>

    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <div class="absolute bottom-6 left-6 right-6 md:left-6 md:right-auto md:w-96 z-10 pointer-events-auto">
        <div class="glass-panel rounded-2xl p-5 shadow-2xl transition-all duration-300 hover:border-amber-500/30">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-semibold tracking-wider text-amber-400 uppercase">Thông số kỹ thuật</h2>
                <span class="text-[10px] bg-amber-500/20 border border-amber-500/30 text-amber-300 px-2.5 py-0.5 rounded-full font-medium">Hạng G2V</span>
            </div>
            <div class="grid grid-cols-2 gap-3 text-xs">
                <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/80">
                    <span class="text-slate-400 block mb-0.5">Nhiệt độ bề mặt</span>
                    <span class="font-bold text-slate-200 text-sm">~5,500 °C</span>
                </div>
                <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/80">
                    <span class="text-slate-400 block mb-0.5">Khối lượng</span>
                    <span class="font-bold text-slate-200 text-sm">1 $M_\odot$</span>
                </div>
                <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/80">
                    <span class="text-slate-400 block mb-0.5">Bán kính</span>
                    <span class="font-bold text-slate-200 text-sm">696,340 km</span>
                </div>
                <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/80">
                    <span class="text-slate-400 block mb-0.5">Tuổi thọ dự kiến</span>
                    <span class="font-bold text-slate-200 text-sm">~10 Tỷ năm</span>
                </div>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                <span>Chất liệu: Plasma & Hydro</span>
                <button id="reset-cam" class="text-amber-400 hover:text-amber-300 font-medium transition-colors cursor-pointer">Đặt lại góc nhìn</button>
            </div>
        </div>
    </div>

    <script>
        // Khởi tạo các biến toàn cục cho Three.js
        let scene, camera, renderer, sunSphere, coronaMesh, starField;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotation = { x: 0, y: 0 };
        let cameraDistance = 15;
        let targetCameraDistance = 15;

        // Khởi tạo ứng dụng khi tải trang xong
        window.onload = function () {
            initScene();
            createStarField();
            createSun();
            setupEventListeners();
            animate();
        };

        function initScene() {
            // Tạo Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030712, 0.015);

            // Tạo Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = cameraDistance;

            // Tạo Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
        }

        function createStarField() {
            // Tạo nền sao lấp lánh trong không gian
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 2000;
            const starPositions = new Float32Array(starCount * 3);

            for (let i = 0; i < starCount * 3; i += 3) {
                starPositions[i] = (Math.random() - 0.5) * 400;
                starPositions[i + 1] = (Math.random() - 0.5) * 400;
                starPositions[i + 2] = (Math.random() - 0.5) * 400;
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.8,
                transparent: true,
                opacity: 0.8
            });

            starField = new THREE.Points(starGeometry, starMaterial);
            scene.add(starField);
        }

        function createSun() {
            // Tạo texture bề mặt Mặt Trời bằng Procedural Canvas 2D
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // Vẽ màu nền dung nham cam rực rỡ
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#ffcc00');
            gradient.addColorStop(0.5, '#ff5500');
            gradient.addColorStop(1.0, '#cc2200');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Thêm các họa tiết đốm lửa plasma (granulation)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            for (let i = 0; i < 1500; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const radius = Math.random() * 25 + 5;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Tạo Texture từ canvas
            const sunTexture = new THREE.CanvasTexture(canvas);
            sunTexture.wrapS = THREE.RepeatWrapping;
            sunTexture.wrapT = THREE.ClampToEdgeWrapping;

            // Hình cầu Mặt Trời chính
            const sunGeometry = new THREE.SphereGeometry(5, 64, 64);
            const sunMaterial = new THREE.MeshBasicMaterial({
                map: sunTexture,
            });

            sunSphere = new THREE.Mesh(sunGeometry, sunMaterial);
            scene.add(sunSphere);

            // Ánh sáng tỏa ra từ Mặt Trời
            const sunLight = new THREE.PointLight(0xfff5e6, 2.5, 300);
            scene.add(sunLight);

            const ambientLight = new THREE.AmbientLight(0x221100, 1.5);
            scene.add(ambientLight);

            // Vầng hào quang (Corona) bên ngoài
            const coronaGeometry = new THREE.SphereGeometry(5.6, 64, 64);
            const coronaMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 }
                },
                vertexShader: `
                    varying vec3 vNormal;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    void main() {
                        float intensity = pow(0.6 - dot(vNormal, vec3(0, 0, 1.0)), 2.2);
                        gl_FragColor = vec4(1.0, 0.6, 0.1, 1.0) * intensity * 1.5;
                    }
                `,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                transparent: true
            });

            coronaMesh = new THREE.Mesh(coronaGeometry, coronaMaterial);
            scene.add(coronaMesh);
        }

        function setupEventListeners() {
            // Xử lý sự kiện kéo chuột (Drag to rotate)
            window.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;

                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                targetRotation.y += deltaX * 0.007;
                targetRotation.x += deltaY * 0.007;

                // Giới hạn góc ngẩng trục X
                targetRotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, targetRotation.x));

                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            // Hỗ trợ cảm ứng điện thoại (Touch support)
            window.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging || e.touches.length !== 1) return;

                const deltaX = e.touches[0].clientX - previousMousePosition.x;
                const deltaY = e.touches[0].clientY - previousMousePosition.y;

                targetRotation.y += deltaX * 0.007;
                targetRotation.x += deltaY * 0.007;
                targetRotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, targetRotation.x));

                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            });

            window.addEventListener('touchend', () => {
                isDragging = false;
            });

            // Xử lý sự kiện cuộn chuột phóng to thu nhỏ (Mouse wheel zoom)
            window.addEventListener('wheel', (e) => {
                targetCameraDistance += e.deltaY * 0.005;
                targetCameraDistance = Math.max(8, Math.min(30, targetCameraDistance));
            });

            // Nút đặt lại góc nhìn
            document.getElementById('reset-cam').addEventListener('click', () => {
                targetRotation.x = 0;
                targetRotation.y = 0;
                targetCameraDistance = 15;
            });

            // Cân chỉnh kích thước màn hình khi thay đổi cửa sổ
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(timestamp) {
            requestAnimationFrame(animate);

            // Hiệu ứng xoay tự động nhẹ và theo thao tác kéo chuột
            if (sunSphere) {
                sunSphere.rotation.y += 0.001; // Tự quay chậm
                sunSphere.rotation.x += (targetRotation.x - sunSphere.rotation.x) * 0.1;
                sunSphere.rotation.y += (targetRotation.y - sunSphere.rotation.y) * 0.1;

                if (coronaMesh) {
                    coronaMesh.rotation.copy(sunSphere.rotation);
                    coronaMesh.material.uniforms.time.value = timestamp * 0.001;
                }
            }

            // Mượt mà khi zoom camera bằng wheel
            cameraDistance += (targetCameraDistance - cameraDistance) * 0.1;
            camera.position.z = cameraDistance;

            // Xoay nhẹ trường sao nền tạo chiều sâu không gian
            if (starField) {
                starField.rotation.y += 0.0002;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
