<script>
        const starsData = [
            { id: 0, name: "Mặt Trời", rank: "G2V", temp: "~5,500 °C", mass: "~1.989 × 10³⁰ kg", radius: "696,340 km", dist: "149.6 triệu km", color: "#ef4444", desc: "Ngôi sao trung tâm hệ mặt trời.", lifeProb: 88.5, lifeDesc: "Quang phổ G2V chuẩn mực.", pros: "Bức xạ quang học lý tưởng.", cons: "Nguy cơ bão mặt trời." },
            { id: 1, name: "Epsilon Eridani", rank: "K2V", temp: "~4,800 °C", mass: "~1.631 × 10³⁰ kg", radius: "735,000 km", dist: "10.5 năm ánh sáng", color: "#fbbf24", desc: "Hệ sao lân cận có đĩa bụi sao.", lifeProb: 84.0, lifeDesc: "Sao lùn cam K2V ổn định.", pros: "Tuổi thọ siêu dài.", cons: "Hoạt động từ tính trẻ." },
            { id: 2, name: "Sigma Draconis", rank: "K0V", temp: "~5,290 °C", mass: "~1.810 × 10³⁰ kg", radius: "540,000 km", dist: "18.8 năm ánh sáng", color: "#f59e0b", desc: "Ngôi sao dạng lùn cam ổn định.", lifeProb: 86.2, lifeDesc: "Độ sáng cực kỳ đều đặn.", pros: "Cực kỳ ổn định quang phổ.", cons: "Vùng sống hẹp hơn." },
            { id: 3, name: "Alpha Centauri B", rank: "K1V", temp: "~5,260 °C", mass: "~1.790 × 10³⁰ kg", radius: "593,000 km", dist: "4.37 năm ánh sáng", color: "#d97706", desc: "Thành viên hệ ba gần nhất.", lifeProb: 81.5, lifeDesc: "Bức xạ nhiệt đều đặn.", pros: "Khoảng cách cực gần.", cons: "Nhiễu động hệ sao đôi/ba." },
            { id: 4, name: "61 Cygni A", rank: "K5V", temp: "~4,350 °C", mass: "~1.392 × 10³⁰ kg", radius: "465,000 km", dist: "11.4 năm ánh sáng", color: "#ea580c", desc: "Chuyển động riêng lớn.", lifeProb: 75.3, lifeDesc: "Nhiệt độ bề mặt thấp hơn.", pros: "Tỏa nhiệt thời gian cực dài.", cons: "Năng lượng bức xạ thấp." },
            { id: 5, name: "70 Ophiuchi A", rank: "K0V", temp: "~5,250 °C", mass: "~1.810 × 10³⁰ kg", radius: "570,000 km", dist: "16.6 năm ánh sáng", color: "#f97316", desc: "Hệ sao đôi quang phổ.", lifeProb: 78.9, lifeDesc: "Quang phổ K0V gần giống Mặt Trời.", pros: "Duy trì nước lỏng tốt.", cons: "Khí hậu dễ biến động." },
            { id: 6, name: "HD 219134", rank: "K3V", temp: "~4,690 °C", mass: "~1.571 × 10³⁰ kg", radius: "600,000 km", dist: "21.3 năm ánh sáng", color: "#fb923c", desc: "Sao lùn chứa hành tinh đá.", lifeProb: 82.7, lifeDesc: "Bức xạ hồng ngoại hài hòa.", pros: "Đã phát hiện hành tinh đá.", cons: "Tia X dao động." },
            { id: 7, name: "Epsilon Indi", rank: "K5V", temp: "~4,620 °C", mass: "~1.452 × 10³⁰ kg", radius: "480,000 km", dist: "11.8 năm ánh sáng", color: "#fdba74", desc: "Tốc độ dịch chuyển cao.", lifeProb: 77.0, lifeDesc: "Hoạt động bề mặt ôn hòa.", pros: "Gần và gió sao nhẹ.", cons: "Độ kim loại thấp hơn." },
            { id: 8, name: "107 Piscium", rank: "K1V", temp: "~5,150 °C", mass: "~1.691 × 10³⁰ kg", radius: "610,000 km", dist: "24.4 năm ánh sáng", color: "#fde047", desc: "Tương đồng mặt trời trẻ.", lifeProb: 83.4, lifeDesc: "Chỉ số kim loại cao.", pros: "Lõi hành tinh vững chắc.", cons: "Khoảng cách khá xa." },
            { id: 9, name: "TW Piscis Austrini", rank: "K4V", temp: "~4,500 °C", mass: "~1.492 × 10³⁰ kg", radius: "500,000 km", dist: "24.9 năm ánh sáng", color: "#facc15", desc: "Cụm sao lân cận.", lifeProb: 74.1, lifeDesc: "Phát xạ tia X trung bình.", pros: "Tiến hóa chậm, an toàn.", cons: "Năng lượng phát ra yếu." },
            { id: 10, name: "Groombridge 1618", rank: "K8V", temp: "~4,000 °C", mass: "~1.193 × 10³⁰ kg", radius: "420,000 km", dist: "15.9 năm ánh sáng", color: "#ca8a04", desc: "Sao lùn cam hoạt động từ tính.", lifeProb: 69.5, lifeDesc: "Nhiệt độ sao thấp.", pros: "Rất bền bỉ, tuổi thọ cao.", cons: "Dễ đóng băng bề mặt." }
        ];

        let currentSelectedIndex = 0;
        let isPageTwo = false;
        let scene, camera, renderer, sunSphere, orbitRing1, starField, starGroup;
        let habZoneMesh = null;
        let isDragging = false, prevMouse = {x:0, y:0}, targetRot = {x:0, y:0}, camDist = 13, targetCamDist = 13;

        function initApp() {
            buildStarListUI();
            init3D();
            setupEventListeners();
        }

        function buildStarListUI() {
            const listContainer = document.getElementById('star-list');
            listContainer.innerHTML = '';
            
            starsData.forEach((star, idx) => {
                const item = document.createElement('div');
                item.className = `p-3 rounded-xl border transition-all cursor-pointer flex items-center justify-between pointer-events-auto ${idx === currentSelectedIndex ? 'bg-cyan-500/20 border-cyan-500/60 text-cyan-200 shadow-md shadow-cyan-500/10' : 'bg-slate-900/60 border-slate-800 text-slate-300 hover:bg-slate-800/80 hover:border-slate-700'}`;
                item.innerHTML = `
                    <div class="flex items-center space-x-2.5">
                        <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${star.color}; box-shadow: 0 0 8px ${star.color}"></span>
                        <div>
                            <span class="font-bold text-xs block">${star.name}</span>
                            <span class="text-[10px] text-slate-400">Hạng ${star.rank} • <span class="text-cyan-400 font-bold">${star.lifeProb}%</span></span>
                        </div>
                    </div>
                    <span class="text-xs font-semibold ${idx === currentSelectedIndex ? 'text-cyan-400' : 'text-slate-500'}">${idx === currentSelectedIndex ? '●' : '○'}</span>
                `;
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    currentSelectedIndex = idx;
                    buildStarListUI();
                    updateStarContent(currentSelectedIndex);
                });
                listContainer.appendChild(item);
            });
        }

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = camDist;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const starGeo = new THREE.BufferGeometry();
            const starPos = new Float32Array(2500 * 3);
            for(let i=0; i<7500; i+=3) {
                starPos[i] = (Math.random()-0.5)*400;
                starPos[i+1] = (Math.random()-0.5)*400;
                starPos[i+2] = (Math.random()-0.5)*400;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            starField = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.8, transparent: true, opacity: 0.8}));
            scene.add(starField);

            scene.add(new THREE.PointLight(0xffffff, 2.2, 300));
            scene.add(new THREE.AmbientLight(0x332211, 1.5));

            starGroup = new THREE.Group();
            scene.add(starGroup);

            updateStarContent(0);
            animate();
        }

        function updateStarContent(idx) {
            const s = starsData[idx];
            document.getElementById('star-title').innerText = `${s.name} (${s.rank} Star)`;
            document.getElementById('star-subtitle').innerText = s.desc;

            document.getElementById('metric-temp').innerText = s.temp;
            document.getElementById('metric-mass').innerText = s.mass;
            document.getElementById('metric-radius').innerText = s.radius;
            document.getElementById('metric-dist').innerText = s.dist;

            document.getElementById('metric-life-val').innerText = `${s.lifeProb}%`;
            document.getElementById('metric-life-bar').style.width = `${s.lifeProb}%`;
            document.getElementById('metric-life-desc').innerText = s.lifeDesc;
            
            document.getElementById('metric-pros').innerText = s.pros;
            document.getElementById('metric-cons').innerText = s.cons;

            while(starGroup.children.length > 0){ 
                starGroup.remove(starGroup.children[0]); 
            }

            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 512);
            grad.addColorStop(0, s.color);
            grad.addColorStop(0.5, '#ff5500');
            grad.addColorStop(1.0, '#cc2200');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 512);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
            for(let i=0; i<900; i++) {
                ctx.beginPath();
                ctx.arc(Math.random()*1024, Math.random()*512, Math.random()*22 + 4, 0, Math.PI*2);
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            sunSphere = new THREE.Mesh(new THREE.SphereGeometry(4.8, 64, 64), new THREE.MeshBasicMaterial({ map: texture }));
            starGroup.add(sunSphere);

            if (habZoneMesh) {
                scene.remove(habZoneMesh);
                habZoneMesh = null;
            }

            if (!isPageTwo) {
                orbitRing1 = createOrbit(6.6, 0xffffff, 0.35);
                starGroup.add(orbitRing1);
            } else {
                createHabitableZoneSystem(s);
            }
        }

        function createHabitableZoneSystem(s) {
            const innerRadius = 6.2;
            const outerRadius = 9.5;
            // Dùng RingGeometry thông thường, không rotateX(Math.PI / 2) để nó nằm vuông góc trực diện với camera
            const geometry = new THREE.RingGeometry(innerRadius, outerRadius, 128);

            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const cx = 512, cy = 512;
            const innerPx = 220, outerPx = 480;

            const gradZone = ctx.createRadialGradient(cx, cy, innerPx, cx, cy, outerPx);
            gradZone.addColorStop(0, 'rgba(6, 182, 212, 0.9)');    
            gradZone.addColorStop(0.7, 'rgba(6, 182, 212, 0.5)');  
            gradZone.addColorStop(1, 'rgba(15, 23, 42, 0.0)');

            ctx.fillStyle = gradZone;
            ctx.fillRect(0, 0, 1024, 1024);

            const zoneTexture = new THREE.CanvasTexture(canvas);

            const material = new THREE.MeshBasicMaterial({
                map: zoneTexture,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.95
            });

            habZoneMesh = new THREE.Mesh(geometry, material);
            // Đặt các góc xoay về 0 để vòng xanh nhìn thẳng trực diện song song màn hình
            habZoneMesh.rotation.x = 0;
            habZoneMesh.rotation.y = 0;
            habZoneMesh.rotation.z = 0;
            scene.add(habZoneMesh);
        }

        function createOrbit(radius, color, opacity) {
            const group = new THREE.Group();
            const ringGeo = new THREE.RingGeometry(radius - 0.03, radius + 0.03, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide, transparent: true, opacity: opacity });
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);
            // Giữ nguyên cho trang 1 nếu muốn, hoặc cho về 0 nếu bạn muốn cả trang 1 nhìn trực diện luôn
            ringMesh.rotation.x = Math.PI / 2;
            group.add(ringMesh);

            const dotGeo = new THREE.SphereGeometry(0.15, 16, 16);
            const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const dot = new THREE.Mesh(dotGeo, dotMat);
            dot.position.set(radius, 0, 0);
            group.add(dot);
            group.userData = { dot: dot, radius: radius };

            group.rotation.x = 0.35;
            group.rotation.z = 0.25;
            return group;
        }

        function triggerFireworksAndRemoveSidebar() {
            const selectedStar = starsData[currentSelectedIndex];
            document.getElementById('congrats-title').innerText = `Đã Chọn: ${selectedStar.name}!`;
            document.getElementById('congrats-desc').innerText = `Hệ sao ${selectedStar.name} đã sẵn sàng. Xác suất sự sống: ${selectedStar.lifeProb}%.`;
            
            const overlay = document.getElementById('congrats-overlay');
            overlay.classList.remove('hidden');

            startFireworksAnimation();

            setTimeout(() => {
                isPageTwo = true;
                document.getElementById('main-header').classList.add('hidden');
                document.getElementById('metrics-panel').classList.add('hidden');
                
                const sidebar = document.getElementById('sidebar');
                if (sidebar) sidebar.remove();

                const zoneLegend = document.getElementById('zone-legend');
                zoneLegend.classList.remove('hidden');
                document.getElementById('zone-system-name').innerText = `Hệ Sao: ${selectedStar.name} (${selectedStar.rank})`;
                document.getElementById('instruction-text').innerText = `Khám phá vùng sinh thái quanh sao • Vòng hiển thị song song trực diện màn hình`;

                // Đưa góc xoay hệ thống về 0 để khi chuyển sang trang 2, vòng xanh thẳng tắp đối diện màn hình
                targetRot.x = 0;
                targetRot.y = 0;

                updateStarContent(currentSelectedIndex);
                targetCamDist = 15;

                overlay.classList.add('hidden');
            }, 2500);
        }

        function startFireworksAnimation() {
            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];
            const colors = ['#22d3ee', '#3b82f6', '#f43f5e', '#fbbf24', '#10b981', '#a855f7'];

            for (let i = 0; i < 6; i++) {
                createFireworkBurst(
                    Math.random() * canvas.width * 0.6 + canvas.width * 0.2,
                    Math.random() * canvas.height * 0.5 + canvas.height * 0.2,
                    colors,
                    particles
                );
            }

            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p, index) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.05;
                    p.alpha -= 0.02;

                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    if (p.alpha <= 0) {
                        particles.splice(index, 1);
                    }
                });

                if (particles.length > 0) {
                    requestAnimationFrame(loop);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            loop();
        }

        function createFireworkBurst(x, y, colors, particlesArray) {
            const particleCount = 60;
            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                particlesArray.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 3 + 1,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1.0
                });
            }
        }

        function setupEventListeners() {
            const container = document.getElementById('canvas-container');
            
            container.addEventListener('mousedown', e => { 
                isDragging = true; 
                prevMouse = {x: e.clientX, y: e.clientY}; 
            });

            window.addEventListener('mousemove', e => {
                if(!isDragging) return;
                const dx = e.clientX - prevMouse.x;
                const dy = e.clientY - prevMouse.y;

                targetRot.y += dx * 0.007;
                targetRot.x += dy * 0.007;
                targetRot.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, targetRot.x));
                prevMouse = {x: e.clientX, y: e.clientY};
            });

            window.addEventListener('mouseup', () => { isDragging = false; });
            
            container.addEventListener('touchstart', e => {
                if(e.touches.length === 1) { 
                    isDragging = true; 
                    prevMouse = {x: e.touches[0].clientX, y: e.touches[0].clientY}; 
                }
            });

            window.addEventListener('touchmove', e => {
                if(!isDragging || e.touches.length !== 1) return;
                const dx = e.touches[0].clientX - prevMouse.x;
                const dy = e.touches[0].clientY - prevMouse.y;

                targetRot.y += dx * 0.007;
                targetRot.x += dy * 0.007;
                targetRot.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, targetRot.x));
                prevMouse = {x: e.touches[0].clientX, y: e.touches[0].clientY};
            });

            window.addEventListener('touchend', () => { isDragging = false; });

            container.addEventListener('wheel', e => {
                targetCamDist = Math.max(7, Math.min(25, targetCamDist + e.deltaY * 0.005));
            });

            const selectBtn = document.getElementById('btn-select');
            if(selectBtn) {
                selectBtn.addEventListener('click', triggerFireworksAndRemoveSidebar);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                const fwCanvas = document.getElementById('fireworks-canvas');
                if(fwCanvas) {
                    fwCanvas.width = window.innerWidth;
                    fwCanvas.height = window.innerHeight;
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if(starGroup) {
                starGroup.rotation.x += (targetRot.x - starGroup.rotation.x) * 0.1;
                starGroup.rotation.y += (targetRot.y - starGroup.rotation.y) * 0.1;
            }
            if(sunSphere) {
                sunSphere.rotation.y += 0.0012;
            }
            if(orbitRing1 && !isPageTwo) {
                orbitRing1.rotation.y += 0.006;
                const t = Date.now() * 0.002;
                orbitRing1.userData.dot.position.x = Math.cos(t) * orbitRing1.userData.radius;
                orbitRing1.userData.dot.position.z = Math.sin(t) * orbitRing1.userData.radius;
            }

            camDist += (targetCamDist - camDist) * 0.1;
            camera.position.z = camDist;
            if(starField) starField.rotation.y += 0.0002;
            renderer.render(scene, camera);
        }

        window.onload = () => {
            initApp();
        };
    </script>
