<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Sao 3D - Vùng Sự Sống Thực Tế</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #030712; font-family: 'Inter', sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(3, 7, 18, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen overflow-hidden flex relative">

    <!-- Tiêu đề hệ sao ở góc trên bên phải -->
    <header class="absolute top-6 right-8 z-10 pointer-events-none text-right">
        <div class="inline-block glass-panel px-5 py-3 rounded-2xl border border-slate-800 shadow-xl max-w-sm">
            <h2 id="system-title" class="text-base font-bold tracking-tight text-cyan-400">Hệ Sao: Đang tải...</h2>
            <p id="system-subtitle" class="text-xs text-slate-300 mt-0.5">Vùng sinh thái & Vành đai sự sống 3D thực tế</p>
        </div>
    </header>

    <!-- Bảng chú thích vùng thực tế -->
    <div class="absolute top-28 right-8 z-10 pointer-events-none">
        <div class="glass-panel p-4 rounded-2xl border border-slate-800 shadow-xl w-72 space-y-2.5">
            <div class="text-xs font-bold text-slate-200 border-b border-slate-800 pb-2 flex items-center justify-between">
                <span>🌌 Cấu Trúc Vùng Sao</span>
                <span class="text-[10px] text-cyan-400 font-mono">Thực Tế Vật Lý</span>
            </div>
            <div class="space-y-2 text-[11px]">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-cyan-500/80 shadow-[0_0_8px_#06b6d4] shrink-0"></span>
                    <span class="text-slate-300"><strong class="text-cyan-300">Vùng Xanh (Lý tưởng):</strong> Vành đai sự sống (Habitable Zone) nước lỏng tồn tại.</span>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-rose-500/80 shadow-[0_0_8px_#f43f5e] shrink-0"></span>
                    <span class="text-slate-300"><strong class="text-rose-400">Vùng Đỏ (Nguy hiểm):</strong> Quá nóng (gần sao) hoặc đóng băng (quá xa).</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Màn hình 3D -->
    <div id="canvas-container" class="absolute inset-0 z-0 cursor-grab active:cursor-grabbing"></div>

    <!-- Hướng dẫn điều khiển -->
    <div class="absolute bottom-6 right-8 z-10 pointer-events-none">
        <div class="flex items-center space-x-2 text-xs bg-slate-900/80 border border-slate-800 px-4 py-2.5 rounded-full text-slate-300 shadow-lg backdrop-blur-md">
            <span class="inline-block w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
            <span>Kéo chuột để xoay 3D • Cuộn để phóng to/thu nhỏ</span>
        </div>
    </div>

    <script>
        // Lấy tên ngôi sao được truyền từ trang trước (hoặc mặc định nếu mở trực tiếp)
        const urlParams = new URLSearchParams(window.location.search);
        const starName = urlParams.get('star') || "Mặt Trời";

        document.getElementById('system-title').innerText = `Hệ Sao: ${starName}`;

        let scene, camera, renderer, starGroup, starMesh, habitableMesh, dangerInnerMesh, dangerOuterMesh, starField;
        let isDragging = false, prevMouse = {x:0, y:0}, targetRot = {x:0, y:0}, camDist = 18, targetCamDist = 18;

        function init3DScene() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = camDist;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Nền trời sao xung quanh
            const starGeo = new THREE.BufferGeometry();
            const starPos = new Float32Array(3000 * 3);
            for(let i=0; i<9000; i+=3) {
                starPos[i] = (Math.random()-0.5)*500;
                starPos[i+1] = (Math.random()-0.5)*500;
                starPos[i+2] = (Math.random()-0.5)*500;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            starField = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.7, transparent: true, opacity: 0.8}));
            scene.add(starField);

            scene.add(new THREE.PointLight(0xffffff, 2.5, 400));
            scene.add(new THREE.AmbientLight(0x222233, 1.5));

            starGroup = new THREE.Group();
            scene.add(starGroup);

            buildRealisticStarSystem(starName);
            animate();
        }

        // Tạo hình khối không gian 3D thực tế (Không gian lồi lõm, không hoàn toàn hình tròn cứng nhắc)
        function buildRealisticStarSystem(name) {
            // 1. Ngôi sao trung tâm
            const starGeo = new THREE.SphereGeometry(2.5, 64, 64);
            const starMat = new THREE.MeshBasicMaterial({ color: 0xffaa33 });
            starMesh = new THREE.Mesh(starGeo, starMat);
            starGroup.add(starMesh);

            // 2. Vùng Xanh (Lý tưởng - Vành đai sự sống) dạng đĩa elip gợn sóng thực tế
            const habitableGeo = createWavyDiskGeometry(4.5, 7.0, 64);
            const habitableMat = new THREE.MeshBasicMaterial({
                color: 0x06b6d4,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.35,
                wireframe: false
            });
            habitableMesh = new THREE.Mesh(habitableGeo, habitableMat);
            habitableMesh.rotation.x = Math.PI / 2.2;
            starGroup.add(habitableMesh);

            // 3. Vùng Đỏ Trong (Nguy hiểm - Quá nóng, gần sao)
            const dangerInnerGeo = createWavyDiskGeometry(1.5, 4.2, 48);
            const dangerInnerMat = new THREE.MeshBasicMaterial({
                color: 0xf43f5e,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.3,
            });
            dangerInnerMesh = new THREE.Mesh(dangerInnerGeo, dangerInnerMat);
            dangerInnerMesh.rotation.x = Math.PI / 2.2;
            starGroup.add(dangerInnerMesh);

            // 4. Vùng Đỏ Ngoài (Nguy hiểm - Quá lạnh, xa sao)
            const dangerOuterGeo = createWavyDiskGeometry(7.3, 11.0, 64);
            const dangerOuterMat = new THREE.MeshBasicMaterial({
                color: 0xf43f5e,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.25,
            });
            dangerOuterMesh = new THREE.Mesh(dangerOuterGeo, dangerOuterMat);
            dangerOuterMesh.rotation.x = Math.PI / 2.2;
            starGroup.add(dangerOuterMesh);
        }

        // Hàm tạo hình học đĩa không gian gợn sóng tự nhiên (phi-tròn, thực tế khoa học)
        function createWavyDiskGeometry(innerRadius, outerRadius, segments) {
            const geometry = new THREE.RingGeometry(innerRadius, outerRadius, segments, 8);
            const pos = geometry.attributes.position;
            
            // Biến đổi đỉnh để tạo độ nhấp nhô, không hoàn hảo tròn chặn (giống đĩa bồi tụ thực tế)
            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i);
                let y = pos.getY(i);
                let z = pos.getZ(i);
                
                let dist = Math.sqrt(x*x + y*y);
                let angle = Math.atan2(y, x);
                
                // Tạo độ gợn sóng sinh học/vật lý ngẫu nhiên dựa trên góc
                let wave = Math.sin(angle * 6) * 0.25 + Math.cos(angle * 3) * 0.15;
                z += wave * (dist / outerRadius);
                
                pos.setXYZ(i, x, y, z);
            }
            geometry.computeVertexNormals();
            return geometry;
        }

        // Sự kiện tương chuột & cảm ứng xoay 3D
        function setupListeners() {
            const container = document.getElementById('canvas-container');
            
            container.addEventListener('mousedown', e => { 
                isDragging = true; 
                prevMouse = {x: e.clientX, y: e.clientY}; 
            });

            window.addEventListener('mousemove', e => {
                if(!isDragging) return;
                const dx = e.clientX - prevMouse.x;
                const dy = e.clientY - prevMouse.y;

                targetRot.y += dx * 0.007;
                targetRot.x += dy * 0.007;
                targetRot.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, targetRot.x));
                prevMouse = {x: e.clientX, y: e.clientY};
            });

            window.addEventListener('mouseup', () => { isDragging = false; });
            
            container.addEventListener('wheel', e => {
                targetCamDist = Math.max(8, Math.min(30, targetCamDist + e.deltaY * 0.005));
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if(starGroup) {
                starGroup.rotation.x += (targetRot.x - starGroup.rotation.x) * 0.1;
                starGroup.rotation.y += (targetRot.y - starGroup.rotation.y) * 0.1;
                // Tự động xoay nhẹ sinh động
                starGroup.rotation.z += 0.001;
            }
            if(habitableMesh) habitableMesh.rotation.z -= 0.0015;
            if(dangerInnerMesh) dangerInnerMesh.rotation.z += 0.002;
            if(dangerOuterMesh) dangerOuterMesh.rotation.z -= 0.0008;

            camDist += (targetCamDist - camDist) * 0.1;
            camera.position.z = camDist;
            if(starField) starField.rotation.y += 0.0001;

            renderer.render(scene, camera);
        }

        window.onload = () => {
            init3DScene();
            setupListeners();
        };
    </script>
</body>
</html>
